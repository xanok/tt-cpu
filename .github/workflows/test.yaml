name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # a stuck job is stopped here, not at GitHub's 6-hour default
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml
          # again with the MISO_RISE strap set and a RAM with stock spi-ram-emu timing
          make MISO_RISE=yes
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

  # Random programs on the Verilog against the instruction model (test/fuzz),
  # a short run: 300 programs in each MISO sampling mode.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # a stuck job is stopped here, not at GitHub's 6-hour default
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install OSS CAD Suite (Verilator)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}  # without it the download hits GitHub's anonymous rate limit

      - name: Random-program test
        run: make -C test/fuzz N=300
